services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    # No host port published on purpose. `server` reaches the db over the
    # compose network as `db:5432`, and nginx:8888 is the only entry point the
    # app needs. Publishing 5432 broke `docker compose up` outright for anyone
    # with Postgres already listening on the host — a very common setup, and a
    # confusing first-run failure ("port is already allocated") for a starter
    # whose whole job is to boot cleanly. Inspect the db with:
    #   docker compose exec db psql -U postgres -d app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      # Prebuilt-image warm start (founding.dev machine images ship these tags
      # and `docker load` them on first boot). BuildKit will NOT treat a loaded
      # image as build cache unless it is named here — without these lines the
      # first boot silently degrades to a full npm ci even when the layers are
      # already on disk. Both tags are listed because the two Dockerfiles share
      # a byte-identical prefix, so either image can warm the install layer.
      # Harmless when the tags don't exist (plain warning, normal build).
      cache_from:
        - fdev-prebuilt-server:latest
        - fdev-prebuilt-client:latest
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: '3001'
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      ALLOWED_ORIGIN: http://localhost:8888
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3001'
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/node_modules
      - /app/server/node_modules

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      # See server.build.cache_from — same warm-start contract.
      cache_from:
        - fdev-prebuilt-client:latest
        - fdev-prebuilt-server:latest
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - /app/node_modules
      - /app/client/node_modules

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - client
      - server
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8888:8888'

volumes:
  db-data:
